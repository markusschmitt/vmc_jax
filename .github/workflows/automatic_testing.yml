name: Automatic testing

on:
  pull_request:
    branches: [ master ]

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1

      - name: Install stuff
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]       
 
      - name: Run tests
        run: mpirun -n 2 python -m pytest --with-mpi tests/ #pytest tests/ #

  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and documentation tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build documentation (warnings are errors)
        run: sphinx-build -b html -W --keep-going documentation/source documentation/_build/html
