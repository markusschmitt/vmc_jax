[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jVMC"
dynamic = ["version"]
description="jVMC: Versatile and performant variational Monte Carlo"
readme = "README.md"
authors = [
    { name = "Markus Schmitt", email = "markus.schmitt@ur.de" }
]
license = { text = "MIT License" }
keywords = ["Neural quantum states", "Variational Monte Carlo"]
dependencies = ["numpy>=2",
                "jax>=0.10.1",
                "jaxlib>=0.10.1",
                "flax>=0.12",
                "optax",
                "tqdm",
                "h5py",
                "chex",
                "scipy"]
requires-python = ">=3.11"
classifiers=[
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["jVMC[docs,examples]", "pytest", "pytest-mpi"]
docs = ["sphinx>=8", "sphinx-rtd-theme>=3", "myst-nb>=1.1"]
# Only needed to run the notebooks in examples/
examples = ["matplotlib", "openfermion"]
cuda12 = ["jax[cuda12]>=0.10.1", "jaxmg[cuda12]"]
cuda13 = ["jax[cuda13]>=0.10.1", "jaxmg[cuda13]"]
cuda12-local = ["jax[cuda12-local]>=0.10.1", "jaxmg[cuda12-local]"]
cuda13-local = ["jax[cuda13-local]>=0.10.1", "jaxmg[cuda13-local]"]

[project.urls]
Documentation = "https://jvmc.readthedocs.io/en/latest/#"
Repository = "https://github.com/markusschmitt/vmc_jax"
Issues = "https://github.com/markusschmitt/vmc_jax/issues"

[tool.setuptools.packages.find]
include = ["jVMC*"]

[tool.setuptools.dynamic]
version = {attr = "jVMC.version.__version__"}
